<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Come and Visit</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Siobhan &amp; Dan</p>
      <h1>When can you come and stay?</h1>
      <p class="lede">Any day that isn't marked is free. Pick some dates and drop us a message.</p>
      <ul class="legend" aria-label="Legend">
        <li><span class="swatch swatch-free"></span>Free</li>
        <li><span class="swatch swatch-busy"></span>Away or already have guests</li>
      </ul>
    </header>

    <section class="openings" aria-labelledby="openings-title">
      <h2 id="openings-title">Next free stretches</h2>
      <ol id="openings" class="openings-list">
        <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      </ol>
    </section>

    <section aria-label="Calendar">
      <div class="months-nav">
        <button type="button" id="prev" aria-label="Previous month">←</button>
        <button type="button" id="today">Today</button>
        <button type="button" id="next" aria-label="Next month">→</button>
      </div>
      <div id="months" class="months" aria-live="polite"></div>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
