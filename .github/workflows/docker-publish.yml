# Build the image, push it to GHCR, then deploy to dan-hetzner over the tailnet.
# Same pattern as f1-sweepstake and route-tracker: the runner joins as an
# ephemeral tag:ci node, and the tailnet policy lets tag:ci Tailscale-SSH into
# tag:appserver as `deploy`, so there is no SSH key or open port.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One deploy at a time, and never cancel one halfway through compose up.
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      STACK: /opt/stacks/visitorcal

    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Resolve the host
        # Ask tailscaled rather than the runner's resolver. This also fails
        # loudly if the join above silently didn't happen: the action reports
        # success even when the OAuth client can't mint a key.
        run: |
          ip=$(tailscale ip -4 dan-hetzner)
          echo "HOST=deploy@${ip}" >> "$GITHUB_ENV"

      - name: Configure SSH
        # accept-new: an ephemeral runner has no known_hosts, and the tailnet
        # has already authenticated the connection before ssh sees it.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/config <<'CFG'
          Host *
            StrictHostKeyChecking accept-new
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Pull and restart
        # The pull logs in inside a throwaway DOCKER_CONFIG so the deploy
        # account's own registry logins for other stacks are left alone. The
        # token goes over stdin, so it never shows in the host's process list.
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh "$HOST" "set -euo pipefail
            cd $STACK
            export DOCKER_CONFIG=\$(mktemp -d)
            trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
            docker login ghcr.io -u '$REGISTRY_USER' --password-stdin >/dev/null
            docker compose pull
            docker compose up -d"

      - name: Check the running container
        run: |
          sleep 10
          ssh "$HOST" "docker ps --filter name=visitor_calendar --format 'table {{.Names}}\t{{.Status}}'
            docker exec visitor_calendar node -v
            docker exec visitor_calendar wget -qO- http://127.0.0.1:3000/api/events | head -c 200; echo"
